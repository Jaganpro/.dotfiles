"$schema" = 'https://starship.rs/config-schema.json'

# Gruvbox Dark powerline prompt:
#  Apple icon (user over SSH) > folder > git > languages > Salesforce org > slow-command time > clock
# and the arrow on its own line.
format = """
[](color_orange)\
$os\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
[](fg:color_aqua bg:color_blue)\
$nodejs\
$python\
$java\
${custom.sf_org}\
${custom.sf_org_prod}\
[](fg:color_blue bg:color_bg3)\
$cmd_duration\
[](fg:color_bg3 bg:color_bg1)\
$time\
[ ](fg:color_bg1)\
$line_break$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"
format = '[ $symbol]($style)'

[os.symbols]
Macos = "󰀵"

# Only shown over SSH or as root
[username]
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[$user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

# Salesforce target org, inside SF projects only (purple; red if the name contains "prod").
# Each draws its own arrows and ends back on blue, so the chain stays seamless when hidden.
[custom.sf_org]
command = "sh ~/.config/starship/sf-org.sh normal"
when = "sh ~/.config/starship/sf-org.sh normal >/dev/null"
shell = ["sh"]
format = '[](fg:color_blue bg:color_purple)[ ☁ $output ](fg:color_fg0 bg:color_purple)[](fg:color_purple bg:color_blue)'

[custom.sf_org_prod]
command = "sh ~/.config/starship/sf-org.sh prod"
when = "sh ~/.config/starship/sf-org.sh prod >/dev/null"
shell = ["sh"]
format = '[](fg:color_blue bg:color_red)[ ⚠ $output ](bold fg:color_fg0 bg:color_red)[](fg:color_red bg:color_blue)'

# Only for commands that took 2 seconds or more
[cmd_duration]
min_time = 2000
style = "bg:color_bg3"
format = '[[ ⏱ $duration ](fg:color_fg0 bg:color_bg3)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
